<style>

</style></head><body><div class="w">
<header><div><h1 id="hn">💊 نظام محاسبة الصيدلية — v6.2</h1><p>قيد مزدوج · جرد شهري · مصرح للشراء · حماية كاملة</p></div><button class="btn" id="bd" style="background:rgba(255,255,255,.22)" onclick="showAudit()">فحص</button></header>
<nav class="tabs" id="tabs"></nav>
<section class="pn" id="p-entry"></section><section class="pn" id="p-close"></section><section class="pn" id="p-dash"></section><section class="pn" id="p-rep"></section><section class="pn" id="p-sup"></section><section class="pn" id="p-jr"></section><section class="pn" id="p-set"></section>
</div><div class="toast" id="toast"></div>
<script>
'use strict';
const K='pharm_v6',$=id=>document.getElementById(id);

const A={'1100':['النقدية','D'],'1110':['البنك','D'],'1200':['العملاء','D'],'1300':['المخزون','D'],'2100':['الموردون','C'],'2200':['أقساط مستحقة','C'],'2300':['قروض','C'],'2400':['ضريبة قيمة مضافة','C'],'2500':['مستحقات المالك','C'],'3100':['رأس المال','C'],'3200':['مسحوبات المالك','D'],'3300':['أرباح محتجزة','C'],'4100':['المبيعات','C'],'4200':['مردودات المبيعات','D'],'5100':['تكلفة المبيعات','D'],'5400':['تسوية المخزون','D'],'6100':['إيجار','D'],'6200':['رواتب','D'],'6300':['كهرباء ومياه','D'],'6400':['صيانة','D'],'6500':['مصاريف أخرى','D'],'6600':['توالف','D'],'6700':['رسوم بنكية','D'],'6800':['فروق جرد دائنة','C'],'6900':['فروق جرد مدينة','D']};

const FLD_LB={cashSales:'مبيعات نقدية',bankSales:'مبيعات بنك/محفظة',creditSales:'مبيعات آجلة',cashSalesRet:'مردودات مبيعات نقدية',creditSalesRet:'مردودات مبيعات آجلة',collections:'تحصيلات عملاء',cashPurch:'مشتريات نقدية',creditPurch:'مشتريات آجلة',cashPurchRet:'مردودات مشتريات نقدية',creditPurchRet:'مردودات مشتريات آجلة',purchDisc:'خصومات مشتريات',cashDisc:'خصم نقدي مستلم',supPay:'سداد موردين',inst:'أقساط مدفوعة',rent:'إيجار',sal:'رواتب',util:'كهرباء ومياه',maint:'صيانة',other:'مصاريف أخرى',fees:'رسوم بنكية',draw:'مسحوبات',cap:'ضخ رأس مال',dep:'إيداع بنكي',damages:'توالف',cogsA:'تكلفة فعلية',adj:'فروق جرد نقدي',open:'رصيد افتتاحي',close:'إقفال شهري',stock:'تسوية جرد',nrv:'هبوط مخزون',x:'قيود مستوردة',arch:'ملخصات أرشيفية',vat:'ضريبة قيمة مضافة',bankrec:'مطابقة بنكية'};

// v6.2: أضفنا vatRate (نسبة الضريبة، 0=معطلة)
const DEF={name:'الصيدلية',od:new Date().getFullYear()+'-01-01',o:{},cogs:78,minCash:3000,maxPers:10,maxDmg:3,payoff:90,cover:30,lockTo:'',pinH:'',pinS:'',vatRate:0};

// v6.2: أضفنا items لتتبع صلاحية الأدوية
let S={v:6,s:{...DEF},e:[],closed:[],pend:0,lastAl:null,log:[],fl:0,lu:0,lastBk:'',items:[]};
let SOK=true,BAD=false;

const p2=n=>String(n).padStart(2,'0'),ds=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)},ad=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const today=()=>ds(new Date()),ms=()=>today().slice(0,8)+'01',ys=()=>today().slice(0,5)+'01-01';
const lms=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return ds(d)},lme=()=>{const d=new Date();d.setDate(0);return ds(d)};
const lastDay=(y,m)=>ds(new Date(y,m,0));
const r2=n=>isFinite(n)?Math.round(n*100+(n<0?-1e-9:1e-9))/100:0;
const fmt=n=>r2(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function num(id){const e=$(id);if(!e)return 0;const v=parseFloat(e.value);if(isNaN(v)||v<0)return 0;return r2(v)}
function numA(id){const e=$(id);if(!e)return null;const v=parseFloat(e.value);if(isNaN(v))return null;if(v<0)return null;return r2(v)}
function rawVal(id){const e=$(id);if(!e||e.value==='')return null;const v=parseFloat(e.value);return isNaN(v)?null:v}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2500)}

function save(){if(BAD){toast('الحفظ متوقف');return}try{localStorage.setItem(K,JSON.stringify(S));SOK=true}catch(e){SOK=false;toast('🔴 تعذّر الحفظ')}}
function load(){try{let r=localStorage.getItem(K);if(r){const p=JSON.parse(r);S={...S,...p};S.s={...DEF,...(p.s||{})};S.e=p.e||[];S.closed=p.closed||[];S.log=p.log||[];S.items=p.items||[];return}
r=localStorage.getItem('pharm_v5');if(r){const p=JSON.parse(r);S.s={...DEF,...(p.s||{})};S.e=p.e||[];S.closed=[];S.log=p.log||[];S.items=[];save()}}catch(x){BAD=true;try{localStorage.setItem(K+'_bad',localStorage.getItem(K))}catch(e){}}}

function genOpening(){S.e=S.e.filter(e=>e.type!=='opening');const o=S.s.o,L=[];let D=0,C=0;
for(const[k,a]of[['cash','1100'],['bank','1110'],['ar','1200'],['inv','1300'],['ap','2100'],['inst','2200'],['loan','2300'],['vat','2400'],['own','2500'],['cap','3100'],['draw','3200']]){
const v=r2(+o[k]||0);if(v<=0)continue;if(A[a][1]==='D'){L.push({a,d:v,c:0,k:'open'});D+=v}else{L.push({a,d:0,c:v,k:'open'});C+=v}}
const re=r2(D-C);if(re>0)L.push({a:'3300',d:0,c:re,k:'open'});else if(re<0)L.push({a:'3300',d:-re,c:0,k:'open'});
if(L.length)S.e.push({id:Date.now(),date:S.s.od,type:'opening',memo:'أرصدة افتتاحية',l:L})}

const MC=new Map();let MS='';
function mv(a,f,t){const sg=S.e.length+':'+(S.e.length?S.e[S.e.length-1].id:0);if(sg!==MS){MC.clear();MS=sg}const key=a+f+t;if(MC.has(key))return MC.get(key);let x=0;for(const e of S.e)if(e.date>=f&&e.date<=t)for(const l of e.l)if(l.a===a)x+=l.d-l.c;const v=r2(A[a][1]==='D'?x:-x);MC.set(key,v);return v}
const bal=(a,t)=>mv(a,'0000-00-00',t);

// v6.2: build() يدعم VAT اختيارياً — عند تعطيله (vatRate=0) يعمل كما كان تماماً
function build(m){
  const L=[];
  const cp=(S.s.cogs||0)/100;
  const vatR=Math.max(0,Math.min(50,+(S.s.vatRate||0)));
  const add=(a,d,c,k)=>{d=r2(d);c=r2(c);if(d>0||c>0)L.push({a,d,c,k})};
  
  const P={cashSales:['1100','4100'],bankSales:['1110','4100'],creditSales:['1200','4100'],
    cashSalesRet:['4200','1100'],creditSalesRet:['4200','1200'],
    collections:['1100','1200'],cashPurch:['1300','1100'],cashPurchRet:['1100','1300'],
    cashDisc:['1100','1300'],inst:['2200','1100'],rent:['6100','1100'],sal:['6200','1100'],
    util:['6300','1100'],maint:['6400','1100'],other:['6500','1100'],fees:['6700','1100'],
    draw:['3200','1100'],cap:['1100','3100'],dep:['1110','1100'],damages:['6600','1300']};
  const SAL=['cashSales','bankSales','creditSales'];
  const RET=['cashSalesRet','creditSalesRet'];
  
  for(const [k,[dr,cr]] of Object.entries(P)){
    const v=m[k]||0;
    if(v<=0)continue;
    if(SAL.includes(k)||RET.includes(k)){
      const net=vatR>0?r2(v/(1+vatR/100)):v;
      const vat=vatR>0?r2(v-net):0;
      if(SAL.includes(k)){
        add(dr,v,0,k);add(cr,0,net,k);
        if(vat>0)add('2400',0,vat,'vat');
        add('5100',net*cp,0,k);add('1300',0,net*cp,k);
      }else{
        add(dr,v,0,k);add(cr,0,net,k);
        if(vat>0)add('2400',vat,0,'vat');
        add('1300',net*cp,0,k);add('5100',0,net*cp,k);
      }
    }else{
      add(dr,v,0,k);add(cr,0,v,k);
    }
  }
  return L;
}

function dayCalc(date,m){const L=build(m),b0=bal('1100',ad(date,-1));let nd=0;
for(const e of S.e)if(e.date===date&&e.type!=='daily')for(const l of e.l)if(l.a==='1100')nd+=l.d-l.c;nd=r2(nd);
const open=r2(b0+nd);
const net=r2(L.filter(l=>l.a==='1100').reduce((s,l)=>s+l.d-l.c,0)),calc=r2(open+net);let adj=0;
if(m.actual!=null){adj=r2(m.actual-calc);if(adj>=.01)L.push({a:'1100',d:adj,c:0,k:'adj'},{a:'6800',d:0,c:adj,k:'adj'});else if(adj<=-.01)L.push({a:'6900',d:-adj,c:0,k:'adj'},{a:'1100',d:0,c:-adj,k:'adj'});else adj=0}
return{L,open,nd,net,calc,adj,close:r2(calc+adj)}}

function PL(f,t){const g=a=>mv(a,f,t),sales=g('4100'),ret=g('4200'),cogs=r2(g('5100')+g('5400')),net=r2(sales-ret),gp=r2(net-cogs);
const ex=['6100','6200','6300','6400','6500','6700'].map(a=>[a,g(a)]),op=r2(ex.reduce((s,x)=>s+x[1],0)),dmg=g('6600'),oth=r2(g('6800')-g('6900'));
return{sales,ret,net,cogs,gp,ex,op,dmg,oth,np:r2(gp-op-dmg+oth)}}

function BS(t){const as={},li={};['1100','1110','1200','1300'].forEach(a=>as[a]=bal(a,t));['2100','2200','2300','2400','2500'].forEach(a=>li[a]=bal(a,t));
const cap=bal('3100',t),dr=bal('3200',t),re=r2(bal('3300',t)+PL('0000-00-00',t).np);
const ta=r2(Object.values(as).reduce((a,b)=>a+b,0)),tl=r2(Object.values(li).reduce((a,b)=>a+b,0)),te=r2(cap-dr+re);
return{as,li,cap,dr,re,ta,tl,te,diff:r2(ta-tl-te)}}

// v6.2: monthStatus تمريرة واحدة
function monthStatus(y,m){
  const from=y+'-'+p2(m)+'-01', to=lastDay(y,m);
  const opening=r2(bal('1300',ad(from,-1)));
  let supPurch=0, cashPurch=0;
  for(const e of S.e){
    if(e.date<from||e.date>to)continue;
    if(e.type==='sup'&&e.sup){
      const k=e.sup.kind;
      if(k==='inv')supPurch+=e.sup.amt;
      else if(k==='ret'||k==='dis')supPurch-=e.sup.amt;
      else if(k==='cr'){if(e.l.some(l=>l.a==='1300'))supPurch-=e.sup.amt}
    }
    if(e.type==='daily'&&e.meta){
      cashPurch+=(e.meta.cashPurch||0);
      cashPurch-=(e.meta.cashPurchRet||0);
      cashPurch-=(e.meta.cashDisc||0);
    }
  }
  const purchases=r2(supPurch+cashPurch);
  const currentBal=r2(bal('1300',to));
  const estimatedCogs=r2(opening+purchases-currentBal);
  const pl=PL(from,to);
  const closed=S.closed.find(c=>c.year===y&&c.month===m);
  return{from,to,opening,purchases,currentBal,estimatedCogs,netSales:pl.net,pl,closed,damages:pl.dmg};
}

function suggestRate(){const last=S.closed.slice(-3);if(!last.length)return null;
const avg=last.reduce((s,c)=>s+c.actualRate,0)/last.length;return r2(avg)}

// v6.2: doClose يقفل الشهر تلقائياً
function doClose(y,m,actualEnding){
  const st0=monthStatus(y,m);
  if(st0.netSales<=0){toast('لا توجد مبيعات هذا الشهر');return false}
  if(!(actualEnding>=0)){toast('قيمة سالبة');return false}
  if(actualEnding>st0.opening+st0.purchases+0.01){toast('⚠️ المخزون الفعلي أكبر من (افتتاحي + مشتريات)');return false}
  S.e=S.e.filter(e=>!(e.type==='close'&&e.close&&e.close.year===y&&e.close.month===m));
  S.closed=S.closed.filter(c=>!(c.year===y&&c.month===m));
  const currentBal=r2(bal('1300',st0.to));
  const adjustment=r2(currentBal-actualEnding);
  const totalCostConsumed=r2(st0.opening+st0.purchases-actualEnding);
  const actualCogs=r2(totalCostConsumed-st0.damages);
  const actualRate=r2((actualCogs/st0.netSales)*100);
  const actualMargin=r2(100-actualRate);
  const closeDate=today()<=st0.to?today():st0.to;
  if(Math.abs(adjustment)>=.01){
    const lines=adjustment>0
      ?[{a:'5400',d:adjustment,c:0,k:'close'},{a:'1300',d:0,c:adjustment,k:'close'}]
      :[{a:'1300',d:-adjustment,c:0,k:'close'},{a:'5400',d:0,c:-adjustment,k:'close'}];
    S.e.push({id:Date.now(),date:closeDate,type:'close',memo:`إقفال ${y}-${p2(m)}`,l:lines,close:{year:y,month:m}});
  }
  const record={year:y,month:m,closedOn:closeDate,closeDate,opening:st0.opening,purchases:st0.purchases,netSales:st0.netSales,estimatedCogs:st0.estimatedCogs,actualEnding,adjustment,totalCostConsumed,damages:st0.damages,actualCogs,actualRate,actualMargin};
  S.closed.push(record);
  S.closed.sort((a,b)=>a.year!==b.year?a.year-b.year:a.month-b.month);
  // v6.2: إقفال تلقائي للفترة
  const periodEnd=lastDay(y,m);
  if(!S.s.lockTo||periodEnd>S.s.lockTo)S.s.lockTo=periodEnd;
  LG('close',`${y}-${p2(m)} → ${actualRate}% | قفل حتى ${periodEnd}`);
  save();
  return{st:st0,record};
}

function applyRate(){const r=suggestRate();if(r===null){toast('لا توجد أشهر مقفلة');return}if(r<=0||r>=100){toast('نسبة غير منطقية');return}S.s.cogs=r;save();toast(`✅ تم تحديث COGS إلى ${r}%`);show('close')}

// v6.2: ALW يحسب أيام الإدخال الفعلية (يمنع مصرحاً وهمياً)
function ALW(t){
  const s=S.s,cash=bal('1100',t),ap=bal('2100',t),inst=bal('2200',t),from=ad(t,-29);
  const real=S.e.filter(e=>e.type==='daily'&&e.date<=t);
  const daysSet=new Set();
  let op=0,pe=0;
  for(const e of real){
    if(e.date>=from){
      daysSet.add(e.date);
      for(const l of e.l){
        if(['6100','6200','6300','6400','6500','6700'].includes(l.a))op+=l.d-l.c;
        if(l.a==='3200')pe+=l.d-l.c;
      }
    }
  }
  const entryDays=daysSet.size;
  const n=Math.max(1,entryDays);
  const avgOp=r2(op/n),avgPe=r2(pe/n);
  const dS=r2(Math.max(ap/s.payoff,supDue(t,7)/7)),dI=r2(inst/30),dO=r2((bal('2400',t)+bal('2500',t))/30);
  const rO=r2(avgOp*3),rP=r2(avgPe*3),free=r2(cash-s.minCash-(S.pend||0));
  const al=r2(free-dS-dI-dO-rO-rP),burn=r2(avgOp+avgPe+dS+dI+dO);
  const p=PL(from,t),sd=r2(p.net/n);
  const nd=entryDays>=7 && entryDays>=15; // v6.2: احتياط أعلى
  const need=nd?r2(sd*(s.cogs/100)*(s.cover||30)-bal('1300',t)):null;
  const sur=r2(p.np/n-avgPe-dI-dO),cc=supDue(t,0)>0?0:Math.max(0,r2(sur*s.payoff-ap));
  const lim=nd?Math.min(al,Math.max(0,need)):al;
  return{cash,ap,inst,avgOp,avgPe,dS,dI,dO,rO,rP,liq:al,need,nd,sur,cc,al:r2(lim),days:burn>0?r2(cash/burn):999,entryDays}
}

function liquidityMetrics(t){
  const p=PL(ad(t,-29),t),days=30;
  const dailyCogs=p.cogs/days,inv=bal('1300',t);
  const dio=dailyCogs>0?r2(inv/dailyCogs):0;
  const dailySales=p.net/days,ar=bal('1200',t);
  const dso=dailySales>0?r2(ar/dailySales):0;
  const ap=bal('2100',t);
  const dpo=dailyCogs>0?r2(ap/dailyCogs):0;
  return{dio,dso,dpo,ccc:r2(dio+dso-dpo)};
}

function hCF1(ac,nm){

function SUP(t){const M={};for(const e of S.e)if(e.type==='sup'&&e.date<=t){const x=e.sup,m=M[x.name]=M[x.name]||{name:x.name,inv:[],cr:0};
if(x.kind==='inv')m.inv.push({due:x.due,amt:x.amt});
else if(x.kind==='ret'||x.kind==='dis')m.cr=r2(m.cr+x.amt);
else if(x.kind==='cr'){const affects=e.l.some(l=>l.a==='1300');if(affects)m.cr=r2(m.cr+x.amt)}}
const Z=[];for(const m of Object.values(M)){m.inv.sort((a,b)=>a.due.localeCompare(b.due));let c=m.cr;const open=[];
for(const i of m.inv){const u=Math.min(i.amt,c);c=r2(c-u);const rs=r2(i.amt-u);if(rs>0)open.push({due:i.due,amt:rs})}
Z.push({name:m.name,open,bal:r2(open.reduce((s,i)=>s+i.amt,0)-c)})}return Z}

<div class="fg"><label>المبلغ</label><input type="number" step="0.01" min="0" id="sp_a"></div>
<div class="fg"><label>التاريخ</label><input type="date" id="sp_d" value="${t}"></div>
<div class="fg"><label>الاستحقاق</label><input type="date" id="sp_u"><small>افتراضي بعد ${S.s.payoff} يوم</small></div>
<button class="btn f" onclick="saveSup()">💾 حفظ</button></div>
<div class="card"><h2>🏭 الأرصدة</h2><div class="tw"><table><tr><th>المورد</th><th>الرصيد</th><th>الاستحقاق</th></tr>${L.filter(x=>x.bal!==0).map(x=>`<tr><td>${esc(x.name)}</td><td class="n">${fmt(x.bal)}</td><td>${x.open[0]?x.open[0].due:'—'}</td></tr>`).join('')}<tr class="tot"><td>الإجمالي</td><td class="n">${fmt(bal('2100',t))}</td><td></td></tr></table></div><small>مستحق خلال 7 أيام: ${fmt(supDue(t,7))} ج.م</small></div></div>`}

function saveSup(){
  const n=$('sp_n').value.trim(),k=$('sp_k').value,a=num('sp_a'),d=$('sp_d').value;
  const u=$('sp_u').value||ad(d||today(),S.s.payoff);
  if(!n||!a||!d){toast('أكمل البيانات');return}
  if(locked(d)){toast('مقفل');return}
  const T={inv:[['1300','2100','creditPurch'],'فاتورة آجلة'],payc:[['2100','1100','supPay'],'سداد نقدي'],payb:[['2100','1110','supPay'],'سداد بنكي'],ret:[['2100','1300','creditPurchRet'],'مرتجع'],dis:[['2100','1300','purchDisc'],'خصم']}[k];
  const [dr,cr,kk]=T[0];
  S.e.push({id:Date.now(),date:d,type:'sup',memo:n+' — '+T[1],l:[{a:dr,d:a,c:0,k:kk},{a:cr,d:0,c:a,k:kk}],sup:{name:n,kind:k,amt:a,due:u}});
  if(k==='inv')S.pend=0;
  LG('supplier',n+' '+k+' '+a);
  save();toast('تم');rSup();
}

let jrN=120;
function rJr(){const AL=[...S.e].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id),L=AL.slice(0,jrN);
$('p-jr').innerHTML=`<div class="card"><h2>📅 اليومية (${AL.length})</h2><div class="tw"><table><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th></th></tr>${L.map(e=>`<tr><td>${e.date}</td><td>${esc(e.memo)}</td><td class="n">${fmt(e.l.reduce((s,l)=>s+l.d,0))}</td><td class="n">${fmt(e.l.reduce((s,l)=>s+l.c,0))}</td><td><button class="btn o s" onclick="viewTx(${e.id})">عرض</button>${e.type==='daily'?`<button class="btn o s" onclick="editDay('${e.date}')">تعديل</button>`:''}${e.type!=='opening'&&e.type!=='arch'?`<button class="btn d s" onclick="delTx(${e.id})">حذف</button>`:''}</td></tr>`).join('')}</table></div>${AL.length>jrN?`<button class="btn o f" style="margin-top:8px" onclick="jrN+=200;rJr()">المزيد</button>`:''}</div>`}

function viewTx(id){const e=S.e.find(x=>x.id===id);if(!e)return;modal(`<h3>${e.date} — ${esc(e.memo)}</h3><table><tr><th>الحساب</th><th>مدين</th><th>دائن</th></tr>${e.l.map(l=>`<tr><td>${l.a} ${A[l.a][0]}</td><td class="n">${l.d?fmt(l.d):'—'}</td><td class="n">${l.c?fmt(l.c):'—'}</td></tr>`).join('')}</table>`)}
function editDay(d){show('entry');$('date').value=d;loadDay()}
function delTx(id){const x=S.e.find(e=>e.id===id);if(x&&locked(x.date)){toast('مقفل');return}ask('حذف؟',()=>{S.e=S.e.filter(e=>e.id!==id);LG('delete',x?x.date:x);save();rJr()})}

// v6.2: إعدادات مع VAT
function rSet(){const s=S.s;$('p-set').innerHTML=`<div class="g"><div class="card"><h2>🏁 الأرصدة الافتتاحية</h2>
<div class="fg"><label>اسم الصيدلية</label><input id="s_name" value="${esc(s.name)}"></div>
<div class="fg"><label>تاريخ البدء</label><input type="date" id="s_od" value="${s.od}"></div>
${[['cash','نقدية'],['bank','بنك'],['ar','عملاء'],['inv','مخزون'],['ap','موردون'],['inst','أقساط'],['loan','قروض'],['vat','ضريبة'],['own','مستحقات المالك'],['cap','رأس مال'],['draw','مسحوبات سابقة']].map(([k,l])=>`<div class="fg"><label>${l}</label><input type="number" step="0.01" min="0" id="o_${k}" value="${s.o[k]||''}"></div>`).join('')}</div>
<div><div class="card"><h2>⚙️ إعدادات التشغيل</h2>
<div class="fg"><label>نسبة COGS الحالية (تقدير يومي)</label><input type="number" step="0.01" id="s_cogs" value="${s.cogs}"><small>تُحدَّث تلقائياً بعد كل جرد شهري. قيمة بداية موصى بها: 78%.</small></div>
<div class="fg"><label>ضريبة القيمة المضافة % (0 = معطلة)</label><input type="number" step="0.01" min="0" max="50" id="s_vat" value="${s.vatRate||0}"><small>عند التفعيل: تُخصم تلقائياً من المبيعات كالتزام على 2400. الأدخلات = الإجمالي شامل الضريبة.</small></div>
<div class="fg"><label>حد أدنى نقدية</label><input type="number" id="s_min" value="${s.minCash}"></div>
<div class="fg"><label>أقصى سحب %</label><input type="number" step="0.1" id="s_pers" value="${s.maxPers}"></div>
<div class="fg"><label>أقصى توالف %</label><input type="number" step="0.1" id="s_dmg" value="${s.maxDmg}"></div>
<div class="fg"><label>سداد موردين (يوم)</label><input type="number" id="s_pay" value="${s.payoff}"></div>
<div class="fg"><label>تغطية مخزون (يوم)</label><input type="number" id="s_cov" value="${s.cover}"></div>
<div class="fg"><label>إقفال حتى</label><input type="date" id="s_lock" value="${s.lockTo}"></div>
<button class="btn f" onclick="saveSet()">💾 حفظ</button></div>
<div class="card"><h2>🔒 الأمان</h2><div class="fg"><label>رمز (6+ خانات)</label><input type="password" id="npin"></div><div class="bar"><button class="btn" onclick="setPin()">${s.pinH?'تغيير':'تفعيل'}</button>${s.pinH?'<button class="btn o" onclick="noPin()">إلغاء</button>':''}</div></div>
<div class="card"><h2>🔧 أدوات</h2><div class="bar"><button class="btn" onclick="backup()">نسخ/استيراد</button><button class="btn d" onclick="reset()">تصفير</button><button class="btn o" onclick="archive()">أرشفة</button></div><small>${S.e.length} قيد — ${Math.round(JSON.stringify(S).length/1024)} ك.ب — ${(S.items||[]).length} صنف</small></div></div></div>`}

function saveSet(){
  const s=S.s;
  if(S.e.some(e=>e.type!=='opening'&&e.date<$('s_od').value)){toast('قيود قبل تاريخ البدء');return}
  const changed=Object.entries({cash:'o_cash',bank:'o_bank',ar:'o_ar',inv:'o_inv',ap:'o_ap',inst:'o_inst',loan:'o_loan',vat:'o_vat',own:'o_own',cap:'o_cap',draw:'o_draw'})
    .some(([k,id])=>num(id)!==r2(+s.o[k]||0));
  const hasReal=S.e.some(e=>e.type!=='opening');
  // v6.2: تحذير تغيير VAT مع قيود موجودة
  const oldVat=+(s.vatRate||0), newVat=parseFloat($('s_vat').value)||0;
  const vatChanged=Math.abs(oldVat-newVat)>0.01&&hasReal;
  if((changed&&hasReal)||vatChanged){
    let msg='';
    if(changed&&hasReal)msg+='تعديل الأرصدة الافتتاحية بعد بدء التسجيل يُعيد حساب كل الأرصدة والأرباح. ';
    if(vatChanged)msg+='تغيير نسبة الضريبة يُطبَّق على القيود الجديدة فقط — القيود القديمة تحتفظ بقيمتها الأصلية. ';
    ask(msg+'متأكد؟',()=>applySet());
    return;
  }
  applySet();
}
function applySet(){
  const s=S.s;s.name=$('s_name').value||'الصيدلية';s.od=$('s_od').value||s.od;
  [['cash','o_cash'],['bank','o_bank'],['ar','o_ar'],['inv','o_inv'],['ap','o_ap'],['inst','o_inst'],['loan','o_loan'],['vat','o_vat'],['own','o_own'],['cap','o_cap'],['draw','o_draw']].forEach(([k,id])=>s.o[k]=num(id));
  const cg=parseFloat($('s_cogs').value);if(cg>0&&cg<100)s.cogs=r2(cg);
  const vr=parseFloat($('s_vat').value);if(!isNaN(vr)&&vr>=0&&vr<50)s.vatRate=r2(vr);
  s.minCash=num('s_min')||3000;s.maxPers=num('s_pers')||10;s.maxDmg=num('s_dmg')||3;s.payoff=Math.max(1,num('s_pay'))||90;s.cover=Math.max(1,num('s_cov'))||30;s.lockTo=$('s_lock').value||'';
  genOpening();save();$('hn').textContent='💊 '+s.name;toast('✅ تم');rSet();
}

function backup(){const d=modal(`<h3>نسخة احتياطية</h3><textarea id="bk" rows="10" style="direction:ltr">${esc(JSON.stringify(S))}</textarea><div class="bar"><button class="btn" id="bc">نسخ</button><button class="btn d" id="bi">استيراد</button></div>`);
d.querySelector('#bc').onclick=()=>{S.lastBk=today();save();$('bk').select();try{navigator.clipboard.writeText($('bk').value);toast('تم')}catch(e){document.execCommand('copy')}};
d.querySelector('#bi').onclick=()=>{try{const p=JSON.parse($('bk').value);if(!p.s||!Array.isArray(p.e))throw 0;ask('استبدال؟',()=>{S={...p};S.items=p.items||[];save();location.reload()})}catch(e){toast('نص غير صالح')}}}
function reset(){ask('حذف كل شيء؟',()=>{try{localStorage.removeItem(K)}catch(e){}location.reload()})}
// v6.2: تحذير الأرشفة
function archive(){
  const cut=ad(today(),-366),old=S.e.filter(e=>e.date<cut&&['daily','stock','imp','close','bankrec'].includes(e.type));
  if(old.length<30){toast('لا شيء');return}
  ask(`ضغط ${old.length} قيد؟<br><small>⚠️ بعد الأرشفة لا يمكن إعادة حساب تلك الفترة تلقائياً. لا تعدّل الأرصدة الافتتاحية بعد الأرشفة وإلا ظهر فرق دائم.</small>`,()=>{
    const Gm={};for(const e of old){const m=e.date.slice(0,7),g=Gm[m]=Gm[m]||{};for(const l of e.l){const k2=l.a+'|'+l.k,x=g[k2]=g[k2]||{a:l.a,k:l.k,d:0,c:0};x.d+=l.d;x.c+=l.c}}
    S.e=S.e.filter(e=>!old.includes(e));let i=0;
    for(const[m,g]of Object.entries(Gm))S.e.push({id:Date.now()+i++,date:ds(new Date(+m.slice(0,4),+m.slice(5),0)),type:'arch',memo:'ملخص '+m,l:Object.values(g).map(x=>({a:x.a,k:x.k,d:r2(x.d),c:r2(x.c)}))});
    save();rSet();
  });
}
const locked=d=>S.s.lockTo&&d<=S.s.lockTo;
function LG(a,i){(S.log=S.log||[]).push({t:new Date().toISOString().slice(0,16).replace('T',' '),a,i:String(i).slice(0,80)});if(S.log.length>300)S.log.shift()}

let it;
async function hs(p){const s='ph:'+p;try{const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return'f'+h}}
function idle(){clearTimeout(it);if(S.s.pinH&&!document.querySelector('.lk'))it=setTimeout(lock,3e5)}
['click','keydown','touchstart'].forEach(v=>document.addEventListener(v,idle,true));
function lock(){if(!S.s.pinH||document.querySelector('.lk'))return;const w=document.querySelector('.w');w.style.visibility='hidden';const d=document.createElement('div');d.className='ov lk';d.style.cssText='background:var(--bg);z-index:99';
d.innerHTML=`<div class="md" style="text-align:center"><h2>🔒 الرمز</h2><input type="password" id="pin" style="text-align:center;font-size:1.3rem"><div id="pm" class="neg"></div><button class="btn f" id="pgo">دخول</button></div>`;document.body.appendChild(d);
const go=async()=>{if(Date.now()<(S.lu||0)){$('pm').textContent='انتظر';return}
if(await(S.s.pinS?kd($('pin').value,S.s.pinS):hs($('pin').value))===S.s.pinH){S.fl=0;save();w.style.visibility='';d.remove();idle()}else{S.fl=(S.fl||0)+1;if(S.fl>=5)S.lu=Date.now()+30000;save();$('pm').textContent='خطأ';$('pin').value=''}};
$('pgo').onclick=go;$('pin').onkeydown=e=>{if(e.key==='Enter')go()};$('pin').focus()}
async function setPin(){const p=$('npin').value;if(p.length<6){toast('6+');return}const sl=Math.random().toString(36).slice(2);try{S.s.pinS=sl;S.s.pinH=await kd(p,sl)}catch(e){toast('لا يدعم');return}save();toast('✅');idle();rSet()}
function noPin(){ask('إلغاء؟',()=>{delete S.s.pinH;delete S.s.pinS;save();rSet()})}
async function kd(p,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:200000},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

function audit(){const I=[],add=(l,m)=>I.push([l,m]),t=today();
for(const e of S.e){let D=0,C=0;for(const l of e.l){if(!A[l.a])add('bad','حساب مجهول '+l.a);D+=l.d;C+=l.c}
if(Math.abs(D-C)>.01)add('bad','قيد غير متوازن '+e.date)}
let td=0,tc=0;for(const a in A){const x=A[a][1]==='D'?bal(a,'9999-12-31'):-bal(a,'9999-12-31');if(x>0)td+=x;else tc-=x}
if(Math.abs(td-tc)>.5)add('bad','ميزان المراجعة غير متوازن');
for(const[a,nm]of[['1100','النقدية'],['1300','المخزون']]){const dy={};for(const e of S.e)for(const l of e.l)if(l.a===a)dy[e.date]=(dy[e.date]||0)+l.d-l.c;let run=0;for(const d of Object.keys(dy).sort()){run=r2(run+dy[d]);if(run<-.01){add('bad','رصيد '+nm+' سالب في '+d);break}}}
if(bal('2100',t)<-.01)add('bad','سداد موردين > المستحق');
if(bal('1200',t)<-.01)add('warn','تحصيلات > مديونية');
const dl=S.e.filter(e=>e.type==='daily').map(e=>e.date).sort();
if(dl.length){
  let miss=0;const f30=ad(t,-30);
  for(let d=dl[0]>f30?dl[0]:f30;d<=ad(t,-1);d=ad(d,1))if(!dl.includes(d))miss++;
  if(miss>0)add('warn','أيام بلا إدخال: '+miss);
  const st=S.e.filter(e=>e.type==='stock'||e.type==='close').map(e=>e.date).sort().pop();
  if(!st||st<ad(t,-35))add('warn','لا جرد حديث');
  if(!S.lastBk||S.lastBk<ad(t,-7))add('warn','لا نسخة احتياطية حديثة');
}
if(!SOK)add('bad','فشل الحفظ');
// v6.2: تنبيهات الصلاحية
const exp=expiringItems();
if(exp.length)add('warn',`${exp.length} صنف قارب الانتهاء`);
return I}
function badge(){const e=$('bd');if(!e)return;const I=audit(),b=I.filter(x=>x[0]==='bad').length,w=I.length-b;e.textContent=b?'🔴 '+b:w?'🟡 '+w:'🟢'}
function showAudit(){const I=audit();modal('<h3>فحص سلامة النظام</h3>'+(I.map(x=>`<div class="al ${x[0]}">${esc(x[1])}</div>`).join('')||'<div class="al ok">✅ سليم</div>')+'<h3 style="margin:12px 0 4px;font-size:.85rem">آخر العمليات</h3>'+(S.log||[]).slice(-20).reverse().map(x=>`<div class="kv"><span>${x.t}</span><span>${x.a} — ${esc(x.i)}</span></div>`).join(''))}

function ask(msg,fn){const d=modal(`<p style="margin-bottom:14px">${msg}</p><div class="bar"><button class="btn" id="ay">نعم</button><button class="btn o" onclick="this.closest('.ov').remove()">إلغاء</button></div>`);d.querySelector('#ay').onclick=()=>{d.remove();fn()}}
function modal(h){const d=document.createElement('div');d.className='ov';d.onclick=e=>{if(e.target===d)d.remove()};d.innerHTML='<div class="md">'+h+'</div>';document.body.appendChild(d);return d}

window.addEventListener('storage',e=>{if(e.key===K)location.reload()});
load();if(!S.e.some(e=>e.type==='opening'))genOpening();save();$('hn').textContent='💊 '+S.s.name;
if(!S.e.length){show('set');toast('ابدأ بالأرصدة الافتتاحية')}else show('entry');if(S.s.pinH)lock();
if(BAD)modal('<h3>⚠️ بيانات تالفة</h3><p>لن يُحفظ شيء. استورد نسخة احتياطية أو ابدأ جديدة.</p><button class="btn f" onclick="BAD=false;this.closest(\'.ov\').remove()">ابدأ جديدة</button>');
</script></body></html>
